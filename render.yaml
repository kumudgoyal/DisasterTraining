services:
  - type: web
    name: disaster-training-api
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter api exec prisma generate && pnpm --filter api exec prisma db push --accept-data-loss && pnpm --filter api db:seed
    startCommand: pnpm --filter api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: disaster-training-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*" # Update this with Vercel URL later
      - key: NDMA_API_URL
        value: "" # Put your NDMA API URL here in Render Dashboard
      - key: NDMA_API_KEY
        value: "" # Put your NDMA API Key here in Render Dashboard
      - key: STATE_API_URL
        value: "" # Put your State API URL here in Render Dashboard
      - key: STATE_API_KEY
        value: "" # Put your State API Key here in Render Dashboard

databases:
  - name: disaster-training-db
    databaseName: disaster_training_db
    plan: free
