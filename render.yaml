services:
  - type: web
    name: disaster-training-api
    env: node
    buildCommand: pnpm install && pnpm --filter api build
    startCommand: pnpm --filter api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: disaster-training-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*" # Update this with Vercel URL later

databases:
  - name: disaster-training-db
    databaseName: disaster_training_db
    user: postgres
    plan: free
